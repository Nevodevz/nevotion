services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nevodevs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nevodevs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nevodevs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nevodevs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nevodevs}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MEDIA_ROOT: /app/media
    volumes:
      # Uploaded avatars must survive container rebuilds.
      - media:/app/media
    expose:
      - "8000"

  mcp:
    build: ./mcp-server
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000/api
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-nevocean.anti-flow.com,localhost:9000,127.0.0.1:9000}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://nevocean.anti-flow.com}
    expose:
      - "9000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared-host edge: mounts the host directory (not a single file) so an
      # atomic `mv` swap of the file inside it is visible to this running
      # container, and an absent/empty directory still leaves this mount and
      # NevOcean's own config valid instead of Docker creating a directory at
      # a missing single-file mount target. nginx.conf includes
      # /etc/nginx/conf.d/shared/*.conf; see EspaMed's deploy/README.md for
      # the staging order.
      - /opt/nevocean/shared-nginx:/etc/nginx/conf.d/shared:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Serve uploaded media directly, without going through the app.
      - media:/var/www/media:ro
    networks:
      - default
      - espamed_edge

networks:
  espamed_edge:
    external: true

volumes:
  pgdata:
  media:
