upstream frontend {
    server frontend:3000;
}
upstream backend {
    # DNS target is the unique Compose alias "nevocean-backend", not the
    # generic service name "backend" — this container also sits on the
    # external espamed_edge network, where EspaMed has its own "backend"
    # service, so plain "backend" DNS is ambiguous and can resolve cross-project.
    server nevocean-backend:8000;
}
upstream mcp {
    server mcp:9000;
}

# Shared-host edge: EspaMed's server blocks, dropped into the mounted
# directory at /etc/nginx/conf.d/shared (bind-mounted read-only from host
# path /opt/nevocean/shared-nginx). If that directory is absent or empty,
# this include simply matches nothing and every server block below stays
# valid and unaffected.
include /etc/nginx/conf.d/shared/*.conf;

# ---- HTTP — только редирект на HTTPS ----
server {
    listen 80;
    server_name nevocean.anti-flow.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное → редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name nevocean.anti-flow.com;

    ssl_certificate     /etc/letsencrypt/live/nevocean.anti-flow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevocean.anti-flow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10M;

    # Capability tokens are secrets. Keep public share URLs out of access logs.
    location = /api/public/boards/view {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media (avatars) — served straight from the shared volume.
    # Only images live here, and they are re-encoded server-side on upload.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        # Never execute anything from a user-writable directory.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # MCP (Model Context Protocol) — remote Streamable HTTP сервис для Claude
    location /mcp {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /share/ {
        access_log off;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
